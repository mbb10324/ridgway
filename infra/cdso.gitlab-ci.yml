include:
 - component: $CI_SERVER_FQDN/cdsov2/cdso/review@main
   inputs:
    name: primus
    pipeline_type: application-container
 - component: $CI_SERVER_FQDN/cdsov2/cdso/review@main
   inputs:
    name: primus
    pipeline_type: "sdd"

.sonarqube:needs:
 needs: ['unit-tests']

push-to-test-acr:
 variables:
  IMAGE_TAG: 'test' # Allows user to override at runtime, otherwise will be set in script
 stage: deliver
 when: manual
 needs: []
 image: registry.levelup.cce.af.mil/cdsov2/containers/approved-tool/kaniko:latest
 tags:
  - cdso
 before_script: # configures Kaniko to use the Azure Credentials Helper for auth
  - |
   mkdir -p /kaniko/.docker
   cat > /kaniko/.docker/config.json << EOF
   { "credHelpers": { "${ACR_TEST}": "acr-env" } }
   EOF
 script:
  - VERBOSITY=${BUILD_CONTAINER_DEBUG+debug}
  - |
   if [ -z "$IMAGE_TAG" ]; then
     if [ -n "$CI_COMMIT_TAG" ]; then
       IMAGE_TAG="$CI_COMMIT_TAG"
     else
       IMAGE_TAG="latest"
     fi
   fi
  - /kaniko/executor
    --context "${DOCKER_CONTEXT_PATH:-.}"
    --dockerfile "${DOCKERFILE_FOLDER:-.}/Dockerfile"
    --destination "${ACR_TEST}/primus:${IMAGE_TAG}"
    --label org.opencontainers.image.url=${CI_PROJECT_URL}
    --label org.opencontainers.image.source=${CI_PROJECT_URL}
    --label org.opencontainers.image.title=${CI_PROJECT_PATH}
    --label org.opencontainers.image.ref.name=${CI_COMMIT_REF_NAME}
    --label org.opencontainers.image.revision=${CI_COMMIT_SHA}
    --label org.opencontainers.image.created=${CI_JOB_STARTED_AT}
    --digest-file="container.env"
    --cache=false
    --single-snapshot
    --compressed-caching=false
    | tee build.log
  - export BUILD_STATUS=$?
  - sed -i "s|:|=|g" container.env
  - echo -e "\nIMAGE_LOCATION=${ACR_TEST}/primus:${IMAGE_TAG}"
  - exit $BUILD_STATUS
 artifacts:
  paths:
   - build.log
  expire_in: 1 week
  when: always

